[package]
name = "musutils"
version = "0.4.0"
edition = "2024"
authors = ["Mus <cuteemus@gmail.com>"]
description = "my rust utils for my rust projects"
license = "MPL-2.0"
repository = "https://gitlab.com/cuteemus/musutils"
keywords = ["utils", "tools"]
categories = ["development-tools"]
copyright = "Copyright (c) 2026 Mus"

[dependencies]
home = "0.5"
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
