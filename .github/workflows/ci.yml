name: CI

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: make fmt-check

      - name: Clippy (v1 + v2, -D warnings)
        run: make clippy

      - name: Tests (v1 + v2)
        run: make test
