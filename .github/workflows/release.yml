name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest

    steps:
      - name: Parse tag
        id: parse
        run: |
          tag="${GITHUB_REF_NAME}"
          stripped="${tag#v}"
          if ! [[ "$stripped" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${tag}' must be of the form v<X.Y.Z>, e.g. v0.5.0"
            exit 1
          fi
          echo "title=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.parse.outputs.title }}
          generate_release_notes: true
