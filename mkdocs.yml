site_name: musutils
site_description: Rust utilities for your projects

plugins:
  - search

theme:
  name: material

  features:
    - navigation.footer
    - navigation.top
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: slate
      primary: black
      accent: blue

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: pages/getting-started/installation.md
      - Features: pages/getting-started/features.md
  - Core API: pages/lib.md
  - Modules:
      - Overview: pages/modules/index.md
      - color:
          - v1: pages/modules/color/v1.md
          - v2: pages/modules/color/v2.md
      - fs:
          - v1: pages/modules/fs/v1.md
          - v2: pages/modules/fs/v2.md
      - http:
          - v1: pages/modules/http/v1.md
          - v2: pages/modules/http/v2.md
      - os:
          - v1: pages/modules/os/v1.md
          - v2: pages/modules/os/v2.md
      - types:
          - v1: pages/modules/types/v1.md
          - v2: pages/modules/types/v2.md
      - vec:
          - v1: pages/modules/vec/v1.md
          - v2: pages/modules/vec/v2.md